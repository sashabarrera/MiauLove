<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="SashaBarrera">
    <title>MiauLove</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="contenedor-principal">
        
        <!-- menu lateral -->
        <aside class="menu-lateral">
            <div class="logo-lateral">
                <img src="static/images/cat-logo.png" alt="logo" class="icono-gatito">
                <h2>MiauLove</h2>
            </div>

            <nav class="enlaces-menu">
                <a href="#" class="link-menu activo">Inicio</a>
                <a href="#" class="link-menu">Subir Imagen</a>
                <a href="#" class="link-menu">Contacto</a>
                <a href="#" class="link-menu">Favoritos</a>
                <a href="#" class="link-menu">Recientes</a>
            </nav>

            <div class="botones-menu">
                <button class="boton-lateral">Configuración</button>
                <button class="boton-lateral boton-cerrar">Cerrar Sesión</button>
            </div>

            <footer class="pie-pagina-lateral">
                <p>Todos los derechos reservados. MiauLove</p>
            </footer>
        </aside>

        <!-- contenido principal -->
        <main class="contenido-principal">
            
            <header class="encabezado-busqueda">
                <div class="caja-busqueda">
                    <input type="text" placeholder="Buscar..." id="input-buscar">
                    <button id="btn-buscar">🔍</button>
                </div>
            </header>

            <section class="seccion-bienvenida">
                <h1>¡Únete y comparte tu amor por los gatitos!</h1>

                <div class="categorias">
                    <button class="boton-categoria activo">Gatitos</button>
                    <button class="boton-categoria">Juveniles</button>
                    <button class="boton-categoria">Adultos</button>
                </div>
            </section>

            <!-- galeria con tarjetas alineadas en fila -->
            <section class="galeria-gatitos">
                
                <div class="tarjeta-gato">
                    <div class="caja-imagen">
                        <img src="static/images/gato1.jpg" alt="gato 1">
                    </div>
                    <button class="boton-corazon">❤️ <span class="contador">1</span></button>
                </div>

                <div class="tarjeta-gato">
                    <div class="caja-imagen">
                        <img src="static/images/gato2.jpg" alt="gato 2">
                    </div>
                    <button class="boton-corazon">❤️ <span class="contador">2</span></button>
                </div>

                <div class="tarjeta-gato">
                    <div class="caja-imagen">
                        <img src="static/images/gato3.jpg" alt="gato 3">
                    </div>
                    <button class="boton-corazon">❤️ <span class="contador">3</span></button>
                </div>

                <div class="tarjeta-gato">
                    <div class="caja-imagen">
                        <img src="static/images/gato4.jpg" alt="gato 4">
                    </div>
                    <button class="boton-corazon">❤️ <span class="contador">4</span></button>
                </div>

            </section>

        </main>

    </div>

    <script src="static/js/script.js"></script>
</body>

</html>
